name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > turingEventLottery/local.properties
          echo "MAPS_API_KEY=dummy_key" >> turingEventLottery/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x turingEventLottery/gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: turingEventLottery

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: turingEventLottery/app/build/reports/tests/
