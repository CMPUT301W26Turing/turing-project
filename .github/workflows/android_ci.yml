name: Android CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > turingEventLottery/local.properties

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES.JSON }}' > turingEventLottery/app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x turingEventLottery/gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: turingEventLottery

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: turingEventLottery/app/build/reports/tests/
